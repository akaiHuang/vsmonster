    <rect x="242" y="83" width="8" height="8"/>
    <rect x="250" y="91" width="8" height="8"/>
    <rect x="258" y="99" width="8" height="8"/>
    <rect x="266" y="75" width="8" height="56"/>
    
    <!-- S -->
    <rect x="284" y="75" width="32" height="8"/>
    <rect x="284" y="75" width="8" height="28"/>
    <rect x="284" y="99" width="32" height="8"/>
    <rect x="308" y="99" width="8" height="28"/>
    <rect x="284" y="123" width="32" height="8"/>
    
    <!-- T -->
    <rect x="326" y="75" width="40" height="8"/>
    <rect x="342" y="83" width="8" height="48"/>
    
