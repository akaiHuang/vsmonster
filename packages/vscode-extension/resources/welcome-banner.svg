<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <defs>
    <style>
      .bg { fill: #22272e; }
      .bracket { fill: none; stroke: #768390; stroke-width: 2; }
      .welcome-text { fill: #adbac7; font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; font-style: italic; }
      .subtitle { fill: #768390; font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; }
      .monster-blue { fill: #1c4bb4; }
      .monster-orange { fill: #e68c40; }
      .monster-red { fill: #d05c2f; }
      .monster-dark-red { fill: #ab3520; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="800" height="250"/>
  
  <!-- Corner brackets -->
  <!-- Top-left -->
  <path class="bracket" d="M 20 40 L 20 20 L 40 20"/>
  <!-- Top-right -->
  <path class="bracket" d="M 760 20 L 780 20 L 780 40"/>
  <!-- Bottom-left -->
  <path class="bracket" d="M 20 210 L 20 230 L 40 230"/>
  <!-- Bottom-right -->
  <path class="bracket" d="M 760 230 L 780 230 L 780 210"/>
  
  <!-- Welcome text -->
  <text class="welcome-text" x="50" y="55">Welcome to</text>
  
  <!-- VSMONSTER pixel text - V -->
