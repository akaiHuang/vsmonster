    <rect x="124" y="99" width="8" height="28"/>
    <rect x="100" y="123" width="32" height="8"/>
    
    <!-- M -->
    <rect x="142" y="75" width="8" height="56"/>
    <rect x="150" y="83" width="8" height="8"/>
    <rect x="158" y="91" width="8" height="8"/>
    <rect x="166" y="83" width="8" height="8"/>
    <rect x="174" y="75" width="8" height="56"/>
    
    <!-- O -->
