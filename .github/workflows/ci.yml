# 🤖 VSMONSTER CI Pipeline (本機軟體，不需要部署)
# 
# 每次 push 或 PR 自動執行：
# 1. 安裝依賴
# 2. 類型檢查
# 3. 建構所有套件
# 4. 執行測試
#
# 注意：此軟體是本機運行，不需要雲端部署

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 8
  NODE_VERSION: 20

jobs:
  # ============================================
  # 📦 安裝與建構
  # ============================================
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
      fail-fast: false
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: 🔍 Type check
        run: pnpm typecheck
        continue-on-error: true

      - name: 🏗️ Build all packages
        run: pnpm build

      - name: 🧪 Run tests
        run: pnpm test
        continue-on-error: true

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            packages/*/dist
            packages/mission-control/.next
          retention-days: 7

  # ============================================
  # 🎬 E2E 測試 + 截圖/錄影
  # ============================================
  e2e:
    name: E2E Tests with Screenshots
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: 🏗️ Build Mission Control
        run: pnpm --filter @vsmonster/mission-control build

      - name: 🎬 Run E2E tests with video recording
        run: pnpm --filter @vsmonster/mission-control test:e2e
        env:
          PLAYWRIGHT_VIDEO: 'on'
          PLAYWRIGHT_SCREENSHOT: 'on'

      - name: 📸 Upload test screenshots & videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            packages/mission-control/test-results/
            packages/mission-control/playwright-report/
          retention-days: 30

  # ============================================
  # 🏷️ 發布新版本 (當 push tag 時)
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📝 Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
